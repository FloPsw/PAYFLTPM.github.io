<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Galerie Vidéo Interactive</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(50%, 1fr));
      grid-template-rows: repeat(2, 1fr);
      height: 100vh;
      width: 100vw;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="video-grid">
    <video id="video1" src="video1.mp4" muted></video>
    <video id="video2" src="video2.mp4" muted></video>
    <video id="video3" src="video3.mp4" muted></video>
    <video id="video4" src="video4.mp4" muted></video>
  </div>

  <script>
    const videos = [
      document.getElementById('video1'),
      document.getElementById('video2'),
      document.getElementById('video3'),
      document.getElementById('video4'),
    ];

    let currentIndex = 0;
    let autoplayActive = true;

    function stopAllVideos() {
      videos.forEach(video => {
        video.pause();
        video.currentTime = 0;
      });
    }

    function playNextVideo() {
      if (!autoplayActive) return;

      stopAllVideos();

      const currentVideo = videos[currentIndex];
      currentVideo.play();

      currentVideo.onended = () => {
        currentIndex = (currentIndex + 1) % videos.length;
        playNextVideo();
      };
    }

    // Gestion du clic : joue la vidéo cliquée, désactive l'autoplay
    videos.forEach((video, index) => {
      video.addEventListener('click', () => {
        autoplayActive = false;
        stopAllVideos();
        video.play();
      });
    });

    // Lancement automatique à la fin du chargement
    window.addEventListener('load', () => {
      playNextVideo();
    });
  </script>

</body>
</html>
